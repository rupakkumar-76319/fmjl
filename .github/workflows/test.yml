name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install jsonschema pymupdf markdown-it-py
      - name: Check every document in the repository
        run: |
          for f in examples/*.fmjl rulebook/*.fmjl README.fmjl; do
            echo "$f"; python -m fmjl check "$f"
          done
      - name: Round trip the rulebook
        run: |
          python -m fmjl md rulebook/fmjl_rulebook_v1.1.fmjl -o /tmp/rb.md
          python -m fmjl new /tmp/rb.md -o /tmp/rb.fmjl --doc fmjl_rulebook
          python - <<'EOF'
          import json
          a = [json.loads(l) for l in open("rulebook/fmjl_rulebook_v1.1.fmjl", encoding="utf-8")]
          b = [json.loads(l) for l in open("/tmp/rb.fmjl", encoding="utf-8")]
          assert a[1:] == b[1:], "elements changed in the round trip"
          print("round trip ok:", len(a) - 1, "elements")
          EOF
      - name: Import the sample PDF and Word file
        run: |
          mkdir -p /tmp/imp
          python -m fmjl pdf examples/solar_report.pdf -o /tmp/imp/solar_report.fmjl
          python -m fmjl docx examples/maintenance_guide.docx -o /tmp/imp/maintenance_guide.fmjl
          python -m fmjl chunks /tmp/imp/solar_report.fmjl --by section | head -c 300
          python -m fmjl pdf examples/sample_book.pdf -o /tmp/imp/sample_book.fmjl
          python - <<'EOF'
          import fmjl
          rows = fmjl.load("/tmp/imp/sample_book.fmjl")
          heads = [e["md"] for e in rows[1:] if e["type"] == "heading"]
          assert heads == ["# CHAPTER I.", "# CHAPTER II.", "# CHAPTER III."], heads
          assert rows[0]["meta"]["fmjl.body"] == next(e["id"] for e in rows[1:] if e["type"] == "heading")
          assert sum("continues" in e for e in rows[1:]) == 3
          assert not any(e["type"] == "paragraph" and "LIGHTHOUSE KEEPER." in e["md"] for e in rows[1:])
          joined = [c for c in fmjl.chunks(rows) if "pages" in c]
          assert len(joined) == 3 and all(len(c["elements"]) == 2 for c in joined)
          items = [e["md"] for e in rows[1:] if e["type"] == "list" and "trimming the wick" in e["md"]]
          assert items and items[0].count("\n- ") == 3, "a list without bullets was run together"
          print("book rules ok")
          EOF
      - name: Quality check of the PDF importer
        run: python benchmark/quality.py --strict examples/solar_report.pdf examples/sample_book.pdf
      - name: Build the docs site
        run: python docs/build.py
      - name: Build the package
        run: |
          pip install build
          python -m build
          pip install dist/*.whl
          fmjl check examples/my_notes.fmjl

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install jsonschema
      - name: Converter matches the Python package byte for byte
        working-directory: fmjl-vscode
        run: npm test
